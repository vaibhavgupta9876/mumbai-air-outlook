name: Refresh the outlook data

# Every morning (08:30 IST) rebuild data.json from the challenge files in this repository, the forecast pair in forecast/
# and the live Open-Meteo API, then commit it so GitHub Pages serves the fresh ventilation outlook and day labels.
on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas numpy
      - name: Build data.json
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python build_data.py --weather api --out data.json
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          git diff --cached --quiet || git commit -m "Daily refresh of data.json"
          git push
